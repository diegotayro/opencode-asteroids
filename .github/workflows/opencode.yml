name: opencode

# OpenCode se activa con menciones en comentarios: /oc o /opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      # Necesario para el intercambio OIDC con la OpenCode App
      id-token: write
      # Necesario para que actions/checkout haga fetch del repo
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          # opencode/big-pickle es un modelo gratuito de OpenCode:
          # no requiere API key ni secrets adicionales
          model: opencode/big-pickle
