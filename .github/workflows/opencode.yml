name: opencode

# OpenCode se activa con menciones en comentarios: /oc o /opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Solo menciones explícitas de usuarios humanos:
    # - Plantilla oficial actual (startsWith o ' /oc' con espacio): evita que
    #   enlaces al repo tipo ".../opencode-asteroids/..." activen el trigger.
    # - Se excluye al bot: si no, el propio comentario del bot (su footer lleva
    #   la URL del repo) re-dispara este workflow en bucle y assertPermissions()
    #   falla porque la API de colaboradores de GitHub devuelve permission: none
    #   para bots de App (bug opencode#17224).
    if: |
      github.event.comment.user.login != 'opencode-agent[bot]' && (
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/opencode') ||
      contains(github.event.comment.body, ' /opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      # Necesario para el intercambio OIDC con la OpenCode App
      id-token: write
      # Necesario para que actions/checkout haga fetch del repo
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          # opencode/big-pickle es un modelo gratuito de OpenCode:
          # no requiere API key ni secrets adicionales
          model: opencode/big-pickle
